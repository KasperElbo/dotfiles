[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "dotfiles-python-smoke"
version = "1.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dotfiles_smoke"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
