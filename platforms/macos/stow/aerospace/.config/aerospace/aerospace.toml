# AeroSpace v2 configuration. The bindings deliberately mirror the Fedora Sway
# profile while preserving Command for native shortcuts and plain Option for
# Danish/symbol character entry. Ctrl+Option is the workstation modifier.
config-version = 2
start-at-login = true
auto-reload-config = true
after-startup-command = []
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
automatically-unhide-macos-hidden-apps = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[exec.env-vars]
PATH = '/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
# Sway Super+Enter / Super+P equivalents. Spotlight remains Command+Space.
ctrl-alt-enter = 'exec-and-forget open -na Ghostty'

# Vim/Sway directional focus and move; the outer monitor boundary is shared.
ctrl-alt-h = 'focus --boundaries all-monitors-outer-frame left'
ctrl-alt-j = 'focus --boundaries all-monitors-outer-frame down'
ctrl-alt-k = 'focus --boundaries all-monitors-outer-frame up'
ctrl-alt-l = 'focus --boundaries all-monitors-outer-frame right'
ctrl-alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
ctrl-alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
ctrl-alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
ctrl-alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

# Sway's wrapped 3x3 workspace grid (Super+Ctrl+h/j/k/l).
ctrl-alt-cmd-h = 'exec-and-forget ~/.local/bin/aerospace-workspace-grid left'
ctrl-alt-cmd-j = 'exec-and-forget ~/.local/bin/aerospace-workspace-grid down'
ctrl-alt-cmd-k = 'exec-and-forget ~/.local/bin/aerospace-workspace-grid up'
ctrl-alt-cmd-l = 'exec-and-forget ~/.local/bin/aerospace-workspace-grid right'

ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'
ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-shift-8 = 'move-node-to-workspace 8'
ctrl-alt-shift-9 = 'move-node-to-workspace 9'

# Sway-compatible layout controls.
ctrl-alt-b = 'layout tiles horizontal'
ctrl-alt-v = 'layout tiles vertical'
ctrl-alt-s = 'layout accordion vertical'
ctrl-alt-w = 'layout accordion horizontal'
ctrl-alt-e = 'layout tiles horizontal vertical'
ctrl-alt-shift-space = 'layout floating tiling'
ctrl-alt-f = 'fullscreen'
ctrl-alt-shift-c = 'close'
ctrl-alt-shift-r = 'reload-config'
ctrl-alt-r = 'mode resize'

# Explicit display operations supplement boundary-aware h/j/k/l movement.
ctrl-alt-tab = 'focus-monitor --wrap-around next'
ctrl-alt-shift-tab = 'move-node-to-monitor --wrap-around --focus-follows-window next'
ctrl-alt-cmd-tab = 'move-workspace-to-monitor --wrap-around next'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = 'layout floating'
