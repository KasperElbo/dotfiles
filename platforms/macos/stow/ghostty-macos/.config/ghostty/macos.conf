# macOS-only Ghostty settings
#
# Loaded by the portable ghostty package's `config-file = ?macos.conf`, which
# resolves to nothing on the platforms that do not stow this package.

# Send Left Option to the shell as Alt/Meta, so fzf's shared Alt-C directory
# picker reaches the widget. Right Option is deliberately left alone: it is
# what types the symbols a Danish layout puts behind Option.
macos-option-as-alt = left
