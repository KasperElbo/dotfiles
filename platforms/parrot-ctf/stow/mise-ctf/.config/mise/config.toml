[tool_alias]
# network-source: neovim-github-releases
nvim = "github:neovim/neovim"

[tools]
nvim = { version = "0.12.5", matching = "nvim-linux", strip_components = 1, bin_path = "bin" }
uv = "latest"

# Parrot/APT owns the system Python used by the distribution and its security
# tools. Neovim is the one profile exception because Parrot 7.3 only packages
# 0.10.x, below the floor config/tool-floors.tsv states; the pin above is
# checked against that floor by scripts/validate-tool-floors.py. Add
# challenge-specific runtimes in the challenge repository instead of turning
# this VM profile into the general workstation manifest.
