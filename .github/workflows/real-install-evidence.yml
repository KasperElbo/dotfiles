name: Real-install evidence

# Nothing in real-install.yml gates a merge. Its four hosted jobs run on the
# Sunday schedule, and the Fedora WSL and Parrot VM jobs run on Kasper's own
# machines only when dispatched (#501). This notices when a hosted job's newest
# success is more than ten days old, or a self-hosted one's more than a month,
# and says so in one tracking issue, so none of them can go dormant unnoticed
# (#538). It does not dispatch anything: the self-hosted runners are not always
# on, and a run on them needs the machines prepared (docs/testing.md,
# "Self-hosted runner contracts").

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: real-install-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Every real-install job succeeded recently
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # A run counts only on a commit main contains, and the report says
          # how far behind main it is.
          fetch-depth: 0

      - name: Find each real-install job's newest success
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          python3 ./scripts/check-real-install-evidence.py --repository "$GITHUB_REPOSITORY" \
            --ref origin/main --report "$RUNNER_TEMP/real-install.md" \
            --findings "$RUNNER_TEMP/findings.md" || status=$?
          if [[ -f "$RUNNER_TEMP/real-install.md" ]]; then
            cat "$RUNNER_TEMP/real-install.md" >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # As in main-evidence.yml: one issue while a job is stale, a comment only
      # when the findings change, closed by the first run that finds none.
      - name: Open or update the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Real-install jobs have not succeeded recently'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          findings="$RUNNER_TEMP/findings.md"
          if [[ ! -s "$findings" ]]; then
            if [[ -f "$findings" && -n "$number" ]]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "Every real-install job has succeeded on main within its allowed age, as of $RUN_URL."
            elif [[ ! -f "$findings" ]]; then
              printf 'The check produced no findings file, so it did not finish.\n' >&2
              exit 1
            fi
            exit 0
          fi
          body="$RUNNER_TEMP/issue.md"
          { cat "$findings"; printf '\nFound by %s.\n' "$RUN_URL"; } >"$body"
          if [[ -z "$number" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            exit 0
          fi
          last="$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body,comments \
            --jq '(.comments | last | .body) // .body')"
          last="${last%%$'\n'Found by *}"
          if [[ "${last%$'\n'}" != "$(cat "$findings")" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi
