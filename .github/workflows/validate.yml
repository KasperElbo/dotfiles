name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:44

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation dependencies
        run: >-
          dnf --assumeyes --setopt=install_weak_deps=False
          install git jq neovim ShellCheck stow

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate shell scripts
        run: ./scripts/lint.sh

      - name: Test bootstrap and installer behavior
        run: ./scripts/test.sh

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check "$BEFORE_SHA..HEAD"
          fi

  windows:
    name: Windows PowerShell validation
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test Windows bootstrap helpers
        shell: pwsh
        run: ./tests/test-windows-bootstrap.ps1

  macos:
    name: macOS 26 arm64 validation
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install validation dependencies
        run: brew install bash ripgrep shellcheck stow

      - name: Validate shell scripts
        run: /opt/homebrew/bin/bash ./scripts/lint.sh

      - name: Test macOS profile configuration
        run: /opt/homebrew/bin/bash ./tests/test-macos.sh

      - name: Check whitespace
        run: git diff --check
