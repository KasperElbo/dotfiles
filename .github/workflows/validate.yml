name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    # A hang detector, not a performance target. This job lints every tracked
    # shell file and runs the whole suite, so it is the long one, and it grows
    # whenever either does: 9m11s, 9m19s and 9m58s on 22 September against a
    # 10-minute budget, then a kill at 10m00s once the suite reached 89. A
    # budget set near the measured runtime fails every pull request in flight
    # at once, and does it as `cancelled` rather than `failure`, which reads
    # like a flake rather than the wall it is. Twenty leaves about ten minutes
    # spare, which at roughly 4.5 seconds a suite is room for another hundred.
    timeout-minutes: 20
    # Pinned by digest so a validation run is reproducible against one
    # exact base image. This is docker.io/library/fedora:44 as of
    # 2026-09-14; see config/network-sources.tsv (validation-image-fedora).
    # network-source: validation-image-fedora
    container: docker.io/library/fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation dependencies
        run: >-
          dnf --assumeyes --setopt=install_weak_deps=False
          install git jq neovim python3 ripgrep ShellCheck stow tar zsh

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan below reads every commit, not just the tip, and
          # the whitespace check compares against the event's base.
          fetch-depth: 0

      # The same command a contributor runs. It is not folded into
      # scripts/lint.sh because lint must stay runnable with no network,
      # and it runs before lint because a committed credential is worth
      # knowing about before anything else about the change.
      # scripts/validate-repository-hygiene.py requires this step to exist,
      # so deleting it fails lint rather than quietly removing the gate.
      - name: Scan for committed credentials
        run: ./scripts/scan-secrets.sh

      - name: Validate shell scripts
        run: ./scripts/lint.sh

      - name: Fetch the lazy.nvim revision the lock file pins
        env:
          LAZY_NVIM_DIR: ${{ runner.temp }}/lazy.nvim
        run: |
          commit="$(jq -r '."lazy.nvim".commit' \
            nvim-lazyvim/.config/nvim/lazy-lock.json)"
          # The Neovim spec-resolution suite resolves the real fragment set
          # through lazy.nvim itself, at the revision this repository pins.
          # network-source: lazy-nvim
          git clone --quiet --filter=blob:none \
            https://github.com/folke/lazy.nvim.git "$LAZY_NVIM_DIR"
          git -C "$LAZY_NVIM_DIR" checkout --quiet "$commit"
          printf 'DOTFILES_LAZY_NVIM=%s\n' "$LAZY_NVIM_DIR" >>"$GITHUB_ENV"

      - name: Test bootstrap and installer behavior
        run: ./scripts/test.sh

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check "$BEFORE_SHA..HEAD"
          fi

  cheatsheets:
    name: Printable cheat sheets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same pinned Fedora image the repository job uses, so the LaTeX
    # toolchain that renders the sheets is the one the --latex profile installs.
    # network-source: validation-image-fedora
    container: docker.io/library/fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Install the LaTeX toolchain
        run: >-
          dnf --assumeyes --setopt=install_weak_deps=False
          install texlive-scheme-medium latexmk poppler-utils

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile and verify every printable cheat sheet
        run: ./docs/cheatsheets/verify.sh

      - name: Prove the rendered PDFs stay untracked
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            printf 'Building the cheat sheets left files behind:\n' >&2
            git status --porcelain --untracked-files=normal >&2
            exit 1
          fi

  windows:
    name: Windows PowerShell validation
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PowerShell's static-analysis floor. It lives here rather than in
      # scripts/lint.sh because that script runs in a Fedora container with no
      # pwsh, and a lint step that skips itself when its tool is missing is the
      # one shape this repository will not accept.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        # network-source: psscriptanalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Repository PSGallery -Scope CurrentUser -Force

      - name: Analyse every tracked PowerShell file
        shell: pwsh
        run: ./tests/test-windows-static-analysis.ps1

      - name: Test Windows bootstrap helpers
        shell: pwsh
        run: ./tests/test-windows-bootstrap.ps1

      - name: Test Windows installed-state verifier fixtures
        shell: pwsh
        run: ./tests/test-windows-verifier.ps1

      - name: Smoke-test top-level Windows verification
        shell: pwsh
        run: ./verify.ps1 -FixturePath ./tests/fixtures/windows-verifier/healthy.json

  macos:
    name: macOS 26 arm64 validation
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whitespace check below compares against the PR's base, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - name: Install validation dependencies
        run: brew install bash ripgrep shellcheck stow

      - name: Install native .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Exercise the Apple Silicon .NET debugger contract
        run: ./tests/integration/macos-dotnet-debug.sh

      - name: Validate shell scripts
        run: /opt/homebrew/bin/bash ./scripts/lint.sh

      - name: Test system-Bash bootstrap compatibility
        run: |
          /bin/bash ./tests/test-execution-plan.sh
          /bin/bash ./tests/test-profile-state.sh
          /bin/bash ./tests/test-macos-command-surface.sh
          /bin/bash ./install.sh --platform macos \
            --theme macchiato --no-ocaml --no-containers --no-tailscale \
            --no-defaults --dry-run --non-interactive >/dev/null

      - name: Test portable verifier and shell-test primitives
        run: |
          /opt/homebrew/bin/bash ./tests/test-verifier.sh
          /opt/homebrew/bin/bash ./tests/test-test-support.sh

      - name: Test macOS profile configuration
        run: |
          /opt/homebrew/bin/bash ./tests/test-macos.sh
          /opt/homebrew/bin/bash ./tests/test-macos-ai.sh
          /opt/homebrew/bin/bash ./tests/test-ocaml-verification.sh

      # The same ranged form the repository job runs. Without a range
      # `git diff --check` inspects the working tree, which is clean on every
      # runner, so the step passed on committed whitespace damage.
      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check "$BEFORE_SHA..HEAD"
          fi
