name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:44

    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation dependencies
        run: >-
          dnf --assumeyes --setopt=install_weak_deps=False
          install git ShellCheck

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell scripts
        run: ./scripts/lint.sh

      - name: Test Secure Boot helpers
        run: ./tests/test-secure-boot.sh

      - name: Test installer validation and dry-runs
        run: ./scripts/test-installer.sh

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check "$BEFORE_SHA..HEAD"
          fi
