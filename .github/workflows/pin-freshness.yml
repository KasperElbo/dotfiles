name: Pin freshness

# The manual-bump pins have no other way of being noticed.
#
# Every other cadence in config/network-sources.tsv announces itself: a package
# manager, a registry, or lazy.nvim's own update checker tells the machine that
# something moved. The `manual-bump` rows are pinned to an exact tag or a
# SHA-256 that nothing would otherwise ever mention again, and the scheduled
# real-install validation only catches one of them once it has *broken* -- a
# download that 404s, a digest that no longer matches. A pin that is three
# releases old and still serving correctly looks exactly like a pin that is
# current.
#
# So this job asks the upstreams once a month and writes the answer into the
# run summary. It opens nothing, changes nothing and never bumps a pin:
# --fail-on-stale is deliberately not passed, because a newer tag is a prompt
# to go and review a release, not a defect. The job does fail when a pin could
# not be read or an upstream could not be reached, since a report that silently
# reached nothing would read as "all current".
#
# The coherence job asks whether each pinned SHA-256 belongs to the artifact at
# its pinned address (#539). A bump that pairs a commit or version with the
# wrong digest reads in a diff exactly like a correct one, and every offline
# gate passes it, so it also runs on a pull request that touches a pin file.
# The pull_request paths are config/pin-freshness.tsv's pin_file column, and
# tests/test-pin-freshness.sh holds them to it.

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pin-freshness.yml
      - config/pin-freshness.tsv
      - scripts/check-pin-freshness.sh
      - common/install-tmux-theme.sh
      - platforms/fedora/scripts/install-kde-theme.sh
      - platforms/parrot-ctf/scripts/install-terminal.sh
      - platforms/macos/lib/dictation.sh
      - platforms/fedora/lib/dictation.sh
      - tests/integration/macos-dotnet-debug.sh
      - scripts/scan-secrets.sh
      - common/lib/bootstrap-tools.sh
      - platforms/macos/lib/homebrew-installer.sh
      - platforms/windows/manifest.psd1

permissions:
  contents: read

concurrency:
  group: pin-freshness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Manual-bump pins against their upstreams
    # A newer upstream release is not something a pull request can fix.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report pin freshness
        run: |
          report="$(mktemp)"
          status=0
          ./scripts/check-pin-freshness.sh | tee "$report" || status=$?
          {
            printf '## Pinned components\n\n'
            printf '```text\n'
            cat "$report"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  coherence:
    name: Pinned digests against their pinned artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each pinned digest against its artifact
        run: |
          report="$(mktemp)"
          status=0
          ./scripts/check-pin-freshness.sh --coherence | tee "$report" || status=$?
          {
            printf '## Pinned digests\n\n'
            printf '```text\n'
            cat "$report"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
