# Use 1-based numbering.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Better terminal capabilities.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# More useful history.
set -g history-limit 50000

# Reduce delay after Escape, especially noticeable in Neovim.
set -sg escape-time 10

# Forward terminal focus changes into panes. tmux defaults this off, and with
# it off it neither asks the terminal for focus reporting nor passes focus on,
# so every FocusGained consumer inside a pane is silently dead. Two depend on
# it: the Catppuccin reload in nvim-lazyvim/.config/nvim/lua/plugins/colorscheme.lua,
# which is what docs/workflows/theming.md means by "refocus the Neovim window",
# and LazyVim's own FocusGained -> checktime, which reloads externally changed
# files.
set -g focus-events on

# Mouse support is useful for scrolling/selecting when needed.
set -g mouse on

# Keep windows alive if a program exits unexpectedly.
set -g remain-on-exit off

# Longer status refresh is sufficient.
set -g status-interval 5

# Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"

# Optional machine-local flavour override.
source-file -q ~/.config/dotfiles/tmux-theme.conf

run ~/.local/share/tmux/plugins/catppuccin/catppuccin.tmux
